name: Docker development stack

on:
  push:
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitleaks.toml"
      - ".github/workflows/docker-development.yml"
      - ".github/dependabot.yml"
      - ".gitignore"
      - "compose.yaml"
      - "deploy/**"
      - "docs/docker-*.md"
      - "requirements*.txt"
      - "requirements*.lock"
      - "backend/**"
      - "DB/**"
      - "Crawler/**"
      - "config/**"
      - "ops_agent/**"
      - "tools/**"
      - "utils/**"
      - "frontend2/**"
      - "tests/test_docker_*.py"
      - "*.py"
  pull_request:
    paths:
      - ".dockerignore"
      - ".gitattributes"
      - ".gitleaks.toml"
      - ".github/workflows/docker-development.yml"
      - ".github/dependabot.yml"
      - ".gitignore"
      - "compose.yaml"
      - "deploy/**"
      - "docs/docker-*.md"
      - "requirements*.txt"
      - "requirements*.lock"
      - "backend/**"
      - "DB/**"
      - "Crawler/**"
      - "config/**"
      - "ops_agent/**"
      - "tools/**"
      - "utils/**"
      - "frontend2/**"
      - "tests/test_docker_*.py"
      - "*.py"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-development-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-scan:
    name: Docker source secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out full history
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install verified Gitleaks binary
        shell: bash
        run: |
          archive="$RUNNER_TEMP/gitleaks.tar.gz"
          curl --fail --silent --show-error --location \
            --output "$archive" \
            https://github.com/gitleaks/gitleaks/releases/download/v8.30.0/gitleaks_8.30.0_linux_x64.tar.gz
          echo "79a3ab579b53f71efd634f3aaf7e04a0fa0cf206b7ed434638d1547a2470a66e  $archive" | sha256sum --check --strict
          tar --extract --gzip --file "$archive" --directory "$RUNNER_TEMP" gitleaks

      - name: Prove Gitleaks default rules detect a synthetic secret
        shell: bash
        run: |
          set -euo pipefail
          canary_dir="$(mktemp --directory "$RUNNER_TEMP/gitleaks-canary.XXXXXX")"
          cleanup_canary() {
            rm --force -- "$canary_dir/probe.txt"
            rmdir -- "$canary_dir"
          }
          trap cleanup_canary EXIT

          canary_prefix="$(printf '\x67\x68\x70\x5f')"
          printf 'token = "%s%s"\n' \
            "$canary_prefix" \
            'fOP5YQKEKPR3SlpzCtaPmDOdfxSBTfgLrTYT' \
            > "$canary_dir/probe.txt"

          set +e
          "$RUNNER_TEMP/gitleaks" dir \
            --config .gitleaks.toml \
            --redact \
            --no-banner \
            "$canary_dir"
          canary_status=$?
          set -e
          if [[ "$canary_status" -ne 1 ]]; then
            echo "Gitleaks canary failed: expected exit 1, got $canary_status." >&2
            exit 1
          fi

      - name: Scan Git history and checked-out files
        run: |
          "$RUNNER_TEMP/gitleaks" git --config .gitleaks.toml --redact --no-banner --verbose
          "$RUNNER_TEMP/gitleaks" dir --config .gitleaks.toml --redact --no-banner --verbose .

  compose-smoke:
    name: Compose migration and health smoke
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify committed Docker build source
        run: python deploy/docker/verify_clean_source.py

      - name: Build and verify an isolated ephemeral stack
        run: python deploy/docker/smoke.py

  arm64-build:
    name: Apple Silicon image build
    needs: secret-scan
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false

      - name: Verify committed Docker build source
        run: python deploy/docker/verify_clean_source.py

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          image: docker.io/tonistiigi/binfmt:latest@sha256:400a4873b838d1b89194d982c45e5fb3cda4593fbfd7e08a02e76b03b21166f0
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0
        with:
          version: v0.36.1
          driver-opts: image=moby/buildkit:buildx-stable-1@sha256:28a898719c18a33f4e8000685287fa36fd0dd9560c6440227d3a732d79bb41d8

      - name: Build and verify the Linux ARM64 stack
        run: python deploy/docker/smoke.py --platform linux/arm64
