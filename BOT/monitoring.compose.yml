services:
  prometheus:
    image: prom/prometheus:${PROMETHEUS_TAG:-latest}
    container_name: mooncen-prometheus
    restart: unless-stopped
    network_mode: host
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=${PROMETHEUS_RETENTION:-30d}
      - --web.enable-lifecycle
      - --web.listen-address=127.0.0.1:9090
    volumes:
      - ./prometheus.remote.yml:/etc/prometheus/prometheus.yml:ro
      - ./prometheus.rules.yml:/etc/prometheus/prometheus.rules.yml:ro
      - prometheus-data:/prometheus

  uptime-kuma:
    profiles:
      - uptime
    image: louislam/uptime-kuma:${UPTIME_KUMA_TAG:-1}
    container_name: mooncen-uptime-kuma
    restart: unless-stopped
    network_mode: host
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  prometheus-data:
  uptime-kuma-data:
