map $http_cf_connecting_ip $monitor_client_key {
    default $http_cf_connecting_ip;
    ""      $binary_remote_addr;
}

map $http_cf_connecting_ip $monitor_forwarded_for {
    default $http_cf_connecting_ip;
    ""      $remote_addr;
}

map $http_cf_visitor $monitor_https_request {
    default                    0;
    ""                         1;
    ~*"scheme"[[:space:]]*:[[:space:]]*"https" 1;
}

limit_req_zone  $monitor_client_key zone=monitor_read:10m rate=30r/m;
limit_conn_zone $monitor_client_key zone=monitor_connections:10m;

log_format mooncen_monitor
    '$time_iso8601 client=$monitor_client_key method=$request_method '
    'uri=$uri status=$status bytes=$body_bytes_sent request_time=$request_time';

server {
    listen 127.0.0.1:3000;
    server_name mon.binary.kr;
    server_tokens off;

    access_log /var/log/nginx/mooncen-monitor-access.log mooncen_monitor;
    error_log  /var/log/nginx/mooncen-monitor-error.log warn;

    client_max_body_size 8k;
    client_body_timeout 5s;
    keepalive_timeout 15s;
    send_timeout 20s;
    limit_conn monitor_connections 5;
    limit_conn_status 429;
    limit_req_status 429;

    add_header Cache-Control "no-store" always;
    add_header Pragma "no-cache" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;

    if ($monitor_https_request = 0) {
        return 308 https://$host$request_uri;
    }

    location ~ ^/api/monitoring/(core|crawler|summary|mooncen|servers|tailscale)$ {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        include /etc/nginx/mooncen-monitor-proxy.inc;
    }

    location = /installers/install.sh {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        alias /opt/mooncen-monitor-app/exporter_installers/install.sh;
        default_type text/x-shellscript;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment; filename=install.sh" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /installers/install-node-exporter-ubuntu.sh {
        rewrite ^ /installers/install.sh last;
    }

    location = /installers/install-macos.sh {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        alias /opt/mooncen-monitor-app/exporter_installers/install-macos.sh;
        default_type text/x-shellscript;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment; filename=install-macos.sh" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /installers/Install-WindowsExporter.ps1 {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        alias /opt/mooncen-monitor-app/exporter_installers/Install-WindowsExporter.ps1;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment; filename=Install-WindowsExporter.ps1" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /installers/SHA256SUMS {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        alias /opt/mooncen-monitor-app/exporter_installers/SHA256SUMS;
        default_type text/plain;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "inline; filename=SHA256SUMS" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /android/latest.json {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        alias /opt/mooncen-monitor-app/android_downloads/latest.json;
        default_type application/json;
        add_header Cache-Control "no-store" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location = /android/mooncen-monitor.apk {
        limit_except GET {
            deny all;
        }
        limit_req zone=monitor_read burst=10 nodelay;
        alias /opt/mooncen-monitor-app/android_downloads/mooncen-monitor.apk;
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "no-store" always;
        add_header Content-Disposition "attachment; filename=mooncen-monitor.apk" always;
        add_header Pragma "no-cache" always;
        add_header Referrer-Policy "no-referrer" always;
        add_header Strict-Transport-Security "max-age=31536000" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "DENY" always;
    }

    location / {
        return 404;
    }
}
