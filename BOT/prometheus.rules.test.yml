rule_files:
  - prometheus.rules.yml

evaluation_interval: 1m

tests:
  - name: exporter target down becomes critical
    interval: 1m
    input_series:
      - series: 'up{alerting="enabled",job="node_exporter",node="nas",instance="nas:9100"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: MoonCenExporterTargetDown
        exp_alerts:
          - exp_labels:
              alerting: enabled
              job: node_exporter
              node: nas
              instance: nas:9100
              severity: critical
              category: server
              service: mooncen-monitoring
            exp_annotations:
              summary: "nas:9100 메트릭 수집 대상이 응답하지 않습니다"
              description: "node_exporter 대상에 2분 이상 연결할 수 없습니다."

  - name: healthy target stays quiet
    interval: 1m
    input_series:
      - series: 'up{alerting="enabled",job="node_exporter",node="bot",instance="bot:9100"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: MoonCenExporterTargetDown
        exp_alerts: []

  - name: pending target worker outage does not page current runtime alerts
    interval: 1m
    input_series:
      - series: 'up{alerting="pending",job="node_exporter",node="gen1crawler",instance="gen1crawler:9100",role="crawler-worker"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: MoonCenExporterTargetDown
        exp_alerts: []
      - eval_time: 3m
        alertname: MoonCenCoreCrawlerDown
        exp_alerts: []

  - name: current cloud exporter outage pages host alert without synthesizing timer down
    interval: 1m
    input_series:
      - series: 'up{alerting="enabled",job="node_exporter",node="cloud",instance="cloud:9100",role="primary"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 3m
        alertname: MoonCenExporterTargetDown
        exp_alerts:
          - exp_labels:
              alerting: enabled
              job: node_exporter
              node: cloud
              instance: cloud:9100
              role: primary
              severity: critical
              category: server
              service: mooncen-monitoring
            exp_annotations:
              summary: "cloud:9100 메트릭 수집 대상이 응답하지 않습니다"
              description: "node_exporter 대상에 2분 이상 연결할 수 없습니다."
      - eval_time: 3m
        alertname: MoonCenCoreCrawlerDown
        exp_alerts: []

  - name: healthy core services stay quiet
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{node="cloud",name="postgresql.service",state="active"}'
        values: '1x6'
      - series: 'node_systemd_unit_state{node="cloud",name="mooncen-frontend.service",state="active"}'
        values: '1x6'
      - series: 'node_systemd_unit_state{node="cloud",name="mooncen-api.service",state="active"}'
        values: '1x6'
      - series: 'node_systemd_unit_state{node="cloud",name="mooncen-crawler.timer",state="active"}'
        values: '1x6'
    alert_rule_test:
      - eval_time: 5m
        alertname: MoonCenCoreDatabaseDown
        exp_alerts: []
      - eval_time: 5m
        alertname: MoonCenCoreFrontendDown
        exp_alerts: []
      - eval_time: 5m
        alertname: MoonCenCoreBackendDown
        exp_alerts: []
      - eval_time: 5m
        alertname: MoonCenCoreCrawlerDown
        exp_alerts: []

  - name: stopped legacy crawler runtime becomes critical
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{node="cloud",name="mooncen-crawler.timer",state="active"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: MoonCenCoreCrawlerDown
        exp_alerts:
          - exp_labels:
              node: cloud
              name: mooncen-crawler.timer
              state: active
              severity: critical
              category: crawler
              service: crawler
            exp_annotations:
              summary: "CRAWLER 스케줄러가 실행 중이 아닙니다"
              description: "현재 관측된 legacy 실행 노드 cloud의 mooncen-crawler.timer 상태를 확인하세요."

  - name: unrelated candidate and target worker timer do not page core alerts
    interval: 1m
    input_series:
      - series: 'node_systemd_unit_state{node="gen1db",name="postgresql.service",state="active"}'
        values: '0x6'
      - series: 'node_systemd_unit_state{node="gen1web",name="mooncen-api.service",state="active"}'
        values: '0x6'
      - series: 'node_systemd_unit_state{node="gen1crawler",name="mooncen-crawler.timer",state="active"}'
        values: '0x6'
    alert_rule_test:
      - eval_time: 4m
        alertname: MoonCenCoreDatabaseDown
        exp_alerts: []
      - eval_time: 4m
        alertname: MoonCenCoreFrontendDown
        exp_alerts: []
      - eval_time: 4m
        alertname: MoonCenCoreBackendDown
        exp_alerts: []
      - eval_time: 4m
        alertname: MoonCenCoreCrawlerDown
        exp_alerts: []
