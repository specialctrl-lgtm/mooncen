groups:
  - name: mooncen-host-health
    interval: 1m
    rules:
      - alert: MoonCenExporterTargetDown
        expr: up{alerting="enabled"} == 0
        for: 2m
        labels:
          severity: critical
          category: server
          service: mooncen-monitoring
        annotations:
          summary: "{{ $labels.instance }} 메트릭 수집 대상이 응답하지 않습니다"
          description: "{{ $labels.job }} 대상에 2분 이상 연결할 수 없습니다."

      - alert: MoonCenCpuUsageHigh
        expr: |
          (
            100 - (
              avg by (instance) (
                rate(node_cpu_seconds_total{alerting="enabled",mode="idle"}[5m])
              ) * 100
            )
          ) > 90
        for: 10m
        labels:
          severity: warning
          category: capacity
          service: mooncen-monitoring
        annotations:
          summary: "{{ $labels.instance }} CPU 사용률이 높습니다"
          description: "CPU 사용률이 10분 이상 90%를 초과했습니다."

      - alert: MoonCenMemoryUsageHigh
        expr: |
          (
            1 - (
              node_memory_MemAvailable_bytes{alerting="enabled"}
              /
              node_memory_MemTotal_bytes{alerting="enabled"}
            )
          ) * 100 > 90
        for: 10m
        labels:
          severity: warning
          category: capacity
          service: mooncen-monitoring
        annotations:
          summary: "{{ $labels.instance }} 메모리 사용률이 높습니다"
          description: "메모리 사용률이 10분 이상 90%를 초과했습니다."

      - alert: MoonCenDiskUsageHigh
        expr: |
          (
            1 - (
              node_filesystem_avail_bytes{
                alerting="enabled",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|fuse.*"
              }
              /
              node_filesystem_size_bytes{
                alerting="enabled",
                fstype!~"tmpfs|devtmpfs|overlay|squashfs|fuse.*"
              }
            )
          ) * 100 > 90
        for: 10m
        labels:
          severity: warning
          category: capacity
          service: mooncen-monitoring
        annotations:
          summary: "{{ $labels.instance }} {{ $labels.mountpoint }} 디스크 사용률이 높습니다"
          description: "디스크 사용률이 10분 이상 90%를 초과했습니다."

  - name: mooncen-core-services
    interval: 1m
    rules:
      - alert: MoonCenCoreDatabaseDown
        expr: node_systemd_unit_state{node="cloud",name="postgresql.service",state="active"} == 0
        for: 3m
        labels:
          severity: critical
          category: database
          service: database
        annotations:
          summary: "DB 서비스가 실행 중이 아닙니다"
          description: "Primary cloud의 postgresql.service 상태를 확인하세요."

      - alert: MoonCenCoreFrontendDown
        expr: node_systemd_unit_state{node="cloud",name="mooncen-frontend.service",state="active"} == 0
        for: 3m
        labels:
          severity: critical
          category: application
          service: frontend
        annotations:
          summary: "FRONT 서비스가 실행 중이 아닙니다"
          description: "Primary cloud의 mooncen-frontend.service 상태를 확인하세요."

      - alert: MoonCenCoreBackendDown
        expr: node_systemd_unit_state{node="cloud",name="mooncen-api.service",state="active"} == 0
        for: 3m
        labels:
          severity: critical
          category: application
          service: backend
        annotations:
          summary: "BACKEND 서비스가 실행 중이 아닙니다"
          description: "Primary cloud의 mooncen-api.service 상태를 확인하세요."

      - alert: MoonCenCoreCrawlerDown
        expr: node_systemd_unit_state{node="cloud",name="mooncen-crawler.timer",state="active"} == 0
        for: 3m
        labels:
          severity: critical
          category: crawler
          service: crawler
        annotations:
          summary: "CRAWLER 스케줄러가 실행 중이 아닙니다"
          description: "현재 관측된 legacy 실행 노드 cloud의 mooncen-crawler.timer 상태를 확인하세요."
