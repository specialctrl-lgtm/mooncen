name: mooncen-dev

x-api-build: &api-build
  context: .
  dockerfile: deploy/docker/api.Dockerfile

x-database-environment: &database-environment
  ENVIRONMENT: development
  DB_HOST: postgres
  DB_PORT: "5432"
  DB_NAME: "${MOONCEN_DB_NAME:-mooncen}"
  DB_SSLMODE: disable
  DB_CONNECT_TIMEOUT: "5"
  DB_STATEMENT_TIMEOUT_MS: "15000"
  DB_LOCK_TIMEOUT_MS: "3000"

x-bounded-logging: &bounded-logging
  driver: local
  options:
    max-size: "10m"
    max-file: "3"

services:
  postgres:
    build:
      context: .
      dockerfile: deploy/docker/postgres.Dockerfile
    image: "${MOONCEN_POSTGRES_IMAGE:-mooncen/postgres:16-postgis-dev}"
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    logging: *bounded-logging
    shm_size: 256mb
    environment:
      POSTGRES_DB: "${MOONCEN_DB_NAME:-mooncen}"
      POSTGRES_USER: "${MOONCEN_DB_USER:-mooncen_admin}"
      POSTGRES_PASSWORD: "${MOONCEN_DB_PASSWORD:?Set MOONCEN_DB_PASSWORD in ~/.config/mooncen-docker/development.env}"
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=C.UTF-8"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - data
    healthcheck:
      test:
        - CMD-SHELL
        - pg_isready -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 10s
    stop_grace_period: 90s
    security_opt:
      - no-new-privileges:true

  migrate:
    build: *api-build
    image: "${MOONCEN_API_IMAGE:-mooncen/api:dev}"
    restart: "no"
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    logging: *bounded-logging
    init: true
    environment:
      <<: *database-environment
      DB_USER: "${MOONCEN_DB_USER:-mooncen_admin}"
      DB_PASSWORD: "${MOONCEN_DB_PASSWORD:?Set MOONCEN_DB_PASSWORD in ~/.config/mooncen-docker/development.env}"
      DB_API_USER: "${MOONCEN_DB_API_USER:-mooncen_api_login}"
      DB_API_PASSWORD: "${MOONCEN_DB_API_PASSWORD:?Set MOONCEN_DB_API_PASSWORD in ~/.config/mooncen-docker/development.env}"
      DB_USE_MIGRATOR: "true"
    command:
      - sh
      - -ec
      - |
        python DB/setup_db.py --mode migrate
        python -m deploy.docker.provision_api_login
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true

  api:
    build: *api-build
    image: "${MOONCEN_API_IMAGE:-mooncen/api:dev}"
    restart: unless-stopped
    cpus: "2.0"
    mem_limit: 2g
    pids_limit: 256
    logging: *bounded-logging
    init: true
    environment:
      <<: *database-environment
      DB_API_USER: "${MOONCEN_DB_API_USER:-mooncen_api_login}"
      DB_API_PASSWORD: "${MOONCEN_DB_API_PASSWORD:?Set MOONCEN_DB_API_PASSWORD in ~/.config/mooncen-docker/development.env}"
      DB_RUNTIME_USER: "${MOONCEN_DB_API_USER:-mooncen_api_login}"
      DB_RUNTIME_PASSWORD: "${MOONCEN_DB_API_PASSWORD:?Set MOONCEN_DB_API_PASSWORD in ~/.config/mooncen-docker/development.env}"
      AUTH_SECRET: "${MOONCEN_AUTH_SECRET:?Set MOONCEN_AUTH_SECRET in ~/.config/mooncen-docker/development.env}"
      MOONCEN_API_PROFILE: public
      API_HOST: 0.0.0.0
      API_PORT: "8001"
      API_RELOAD: "false"
      MOONCEN_CORS_ORIGINS: "${MOONCEN_CORS_ORIGINS:-http://localhost:5174}"
      MOONCEN_TRUSTED_HOSTS: "localhost,127.0.0.1"
      OAUTH_REDIRECT_URIS: "${MOONCEN_OAUTH_REDIRECT_URI:-http://localhost:5174/}"
      VITE_SITE_URL: "${MOONCEN_SITE_URL:-http://localhost:5174}"
      GOOGLE_OAUTH_CLIENT_ID: "${MOONCEN_GOOGLE_OAUTH_CLIENT_ID:-}"
      GOOGLE_OAUTH_CLIENT_SECRET: "${MOONCEN_GOOGLE_OAUTH_CLIENT_SECRET:-}"
      NAVER_OAUTH_CLIENT_ID: "${MOONCEN_NAVER_OAUTH_CLIENT_ID:-}"
      NAVER_OAUTH_CLIENT_SECRET: "${MOONCEN_NAVER_OAUTH_CLIENT_SECRET:-}"
      OAUTH_ALLOW_LEGACY_STATE: "false"
      OPS_CRAWLER_API_DB_REQUIRED: "false"
    ports:
      - "127.0.0.1:${MOONCEN_API_PORT:-8001}:8001"
    depends_on:
      migrate:
        condition: service_completed_successfully
    networks:
      - data
      - web
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/logs:size=64m,uid=10001,gid=10001,mode=0700
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s

  frontend:
    build:
      context: .
      dockerfile: deploy/docker/frontend.Dockerfile
    image: "${MOONCEN_FRONTEND_IMAGE:-mooncen/frontend:dev}"
    restart: unless-stopped
    cpus: "1.0"
    mem_limit: 256m
    pids_limit: 128
    logging: *bounded-logging
    init: true
    ports:
      - "127.0.0.1:${MOONCEN_WEB_PORT:-5174}:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${MOONCEN_RUNTIME_CONFIG_FILE:-./frontend2/public/runtime-config.js}"
        target: /usr/share/nginx/html/runtime-config.js
        read_only: true
        bind:
          create_host_path: false
    networks:
      - web
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/_frontend_health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 15s

volumes:
  postgres-data:

networks:
  data:
    internal: true
  web:
