        - 일반 강좌
        - 타임세일
        - 특별쿠폰
        - 할인
        - 지인추천
      course_format_filters:
        - 1회
        - 2~4회
        - 5회이상
      status_filters:
        - 마감임박
        - 신청가능
        - 중간신청
        - 마감
        - 대기신청
