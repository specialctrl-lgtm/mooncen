    name: 홈플러스 문화센터
    group: mart
    priority: 1
    status: active
    base_url: "https://mschool.homeplus.co.kr"
    list_url: "https://mschool.homeplus.co.kr/Lecture/SearchResult"
    crawler_module: "Crawler.Crawler_Homeplus"
