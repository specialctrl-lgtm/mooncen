  - provider: SHINSEGAE_ACADEMY
    name: 신세계 아카데미
    group: department_store
    priority: 1
    status: active
    base_url: "https://sacademy.shinsegae.com"
    list_url: "https://sacademy.shinsegae.com/sdotcom/web/HP0010P0/HP0010P0.do#none"
    source_url: "https://sacademy.shinsegae.com/sdotcom/web/HP0010P0/HP0010P0.do#none"
    crawler_module: "Crawler.Crawler_YamlSources"
    crawler_script: "Crawler/Crawler_YamlSources.py"
    crawler_args:
      provider: SHINSEGAE_ACADEMY
    run_command: "python -X utf8 Crawler/Crawler_YamlSources.py --provider SHINSEGAE_ACADEMY"
    production:
      enabled: true
      included_in_run_crawlers: true
      coordinate_update_after_crawl: true
      coordinate_update_mode: missing_only
      quality_report_required: true
    access:
      login_required: false
      selenium_required: likely
      api_available: true
      public_list_visible: true
    observed:
      page_title: "강좌찾기 - 신세계 아카데미"
      maintenance_notice: "홈페이지 신세계 아카데미 시스템 점검 중입니다."
      store_selector:
        select_selector: "#storeCode"
        name: "storeCode"
        code_attribute: "value"
        label_source: "option text"
        binding_function: "gfnStoreBindCombo2('storeCode', 'store', '', storeCode, 'fnBindSmstBindCombo')"
        option_source: "/sdotcom/js/common/combo.js"
        interaction_note: "#storeCode 값을 변경하면 store_code 쿠키가 저장되고 학기 콤보가 다시 바인딩된다. 지점별 수집은 storeCode를 변경하면서 getLectList.do를 호출한다."
      store_codes:
        - code: "ON"
          name: "신세계 온 아카데미"
        - code: "01"
          name: "본점"
        - code: "03"
          name: "타임스퀘어 & ON"
        - code: "14"
          name: "강남점"
        - code: "15"
          name: "마산점"
        - code: "16"
          name: "신세계 사우스시티"
        - code: "18"
          name: "센텀시티"
        - code: "19"
          name: "의정부점"
        - code: "37"
          name: "김해점"
        - code: "40"
          name: "스타필드하남점"
        - code: "70"
          name: "천안아산점"
        - code: "90"
          name: "대구신세계"
        - code: "D1"
          name: "대전신세계"
      inactive_store_codes:
        - code: "50"
          name: "강남 리틀란드"
          note: "combo.js에 주석 처리됨"
        - code: "81"
          name: "광주신세계"
          note: "리뉴얼로 combo.js에 주석 처리됨"
      list_api:
        method: POST
        url: "https://sacademy.shinsegae.com/sdotcom/web/HP0010P0/getLectList.do"
        data_source: "#frm serialize"
        response_type: json
        result_key: "lectList"
        pagination_key: "pageNavi"
        branch_param: "storeCode"
        page_param: "curPage"
        pagination:
          container_selector: "#pageNavi"
          page_input_selector: "#curPage"
          js_function: "fnGoPage(page)"
          page_param: "curPage"
          completion_rule: "increment curPage until lectList is empty or pageNavi has no next page."
      detail_url_pattern: "https://sacademy.shinsegae.com/sdotcom/web/HP0010P0/HP0010P1.do?yearCode={yearCode}&smstCode={smstCode}&storeCode={storeCode}&lectCode={lectCode}#"
      field_hints_from_json:
        title: "lectName"
        branch: "storeName"
        branch_code: "storeCode"
        provider_course_id: "yearCode + smstCode + storeCode + lectCode"
        year_code: "yearCode"
        semester_code: "smstCode"
        semester_name: "smstCodeName"
        schedule_raw: "dayCodeName + lectHm"
        period: "lectPeriod"
        sessions: "lectCnt"
        instructor: "tchName"
        fee: "lectAmt or lectAmtCurr"
        status: "lectStat: PR=접수전, RT=접수중, RC=마감, ST=대기등록, LC=강좌종료"
      filters:
        on_off:
          - 전체
          - 오프라인
          - 온라인
        receipt_status:
          - 전체
          - 접수전
          - 접수중
          - 접수마감
          - 대기등록
        weekdays:
          - 전체
          - 일
          - 월
          - 화
          - 수
          - 목
          - 금
          - 토
        times:
          - 전체
          - "09:00 ~ 11:59"
          - "12:00 ~ 16:59"
          - "17:00 ~"
        search_conditions:
          - 전체
          - 강좌명
          - 강사명
          - 검색어
    field_mapping_hints:
      branch_code: "#storeCode value"
      branch_name: "#storeCode option text from combo.js gfnStoreBindCombo2"
      list_api: "POST /sdotcom/web/HP0010P0/getLectList.do with serialized #frm"
      list_url_by_branch: "change #storeCode through ON, 01, 03, 14, 15, 16, 18, 19, 37, 40, 70, 90, D1; set storeCode, schSmstCode, curPage then POST getLectList.do"
      pagination: "increment curPage until lectList is empty or pageNavi has no next page"
      raw_url: "HP0010P1.do?yearCode={yearCode}&smstCode={smstCode}&storeCode={storeCode}&lectCode={lectCode}#"
      title: "lectList[].lectName"
      status: "lectList[].lectStat"
      fee: "lectList[].lectAmtCurr / lectAmt"
      schedule_raw: "lectList[].dayCodeName + lectList[].lectHm"
    next_actions:
      - "운영 공유 크롤러 Crawler_YamlSources.py로 수집한다."
      - "POST getLectList.do for each #storeCode option and page until no new rows are returned."
      - "Validate lectStat mapping against detail pages."
      - "Run 100 item validation after each selector change."
      - "After production crawl, run missing-only Google Geocoding address/coordinate update."
    quality_targets:
      title: 0.99
      branch: 0.99
      raw_url: 0.99
      status: 0.95
      fee: 0.95
      schedule_raw: 0.95
      target_age_group: 0.80
      image_url: 0.70
      description: 0.70
    risks:
      - "#storeCode options are populated by JavaScript, so plain HTML fetch sees an empty select."
      - "The page currently displays a system maintenance notice; list API behavior must be checked at crawler runtime."
      - "Semester code is store-dependent and must be loaded before list API calls."

