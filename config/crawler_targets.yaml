defaults:
  test_limits:
    discovery: 20
    validation: 100
    production_sample: 1000
  required_fields:
    - title
    - provider
    - provider_course_id
    - branch
    - raw_url
    - status
    - fee
    - schedule_raw
  desired_fields:
    - category_raw
    - target
    - target_age_group
    - target_min_age
    - target_max_age
    - image_url
    - description
    - instructor
    - start_date
    - end_date
    - sessions

targets:
