      status: "마감임박/신청가능/중간신청/마감/대기신청"
      fee: "list text contains amount such as 65,000 원"
      schedule_raw: "date, weekday, repeat text, and time range from list/detail"
      target: "성인, 엄마랑 아가랑, 어린이, 유아, 패밀리 or age text in title"
