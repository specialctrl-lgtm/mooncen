name: mooncen-production

x-runtime-hardening: &runtime-hardening
  read_only: true
  init: true
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true
  logging:
    driver: json-file
    options:
      max-size: 10m
      max-file: "3"

x-api-runtime: &api-runtime
  image: "${MOONCEN_API_IMAGE:?Set the manifest-bound API image tag}"
  pull_policy: never
  env_file:
    - /etc/mooncen/container-api.env
  environment:
    MOONCEN_API_PROFILE: public
    DB_HOST: /var/run/postgresql
    DB_PORT: "5432"
    DB_SSLMODE: disable
    DB_SSLROOTCERT: ""
    DB_SSLCERT: ""
    DB_SSLKEY: ""
    API_RELOAD: "false"
  volumes:
    - type: bind
      source: /var/run/postgresql
      target: /var/run/postgresql
      read_only: true
  networks:
    - app
  <<: *runtime-hardening

services:
  migrate:
    image: "${MOONCEN_API_IMAGE:?Set the manifest-bound API image tag}"
    pull_policy: never
    profiles:
      - migration
    restart: "no"
    env_file:
      - "${MOONCEN_MIGRATOR_ENV_FILE:?Set a private one-shot migrator env file}"
    environment:
      ENVIRONMENT: production
      DB_HOST: /var/run/postgresql
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_SSLROOTCERT: ""
      DB_SSLCERT: ""
      DB_SSLKEY: ""
      DB_USE_MIGRATOR: "true"
    command:
      - python
      - DB/setup_db.py
      - --mode
      - plan
      - --json
      - --require-current
    volumes:
      - type: bind
        source: /var/run/postgresql
        target: /var/run/postgresql
        read_only: true
    networks:
      - app
    tmpfs:
      - /tmp:size=64m,mode=1777
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    <<: *runtime-hardening

  api:
    <<: *api-runtime
    restart: unless-stopped
    environment:
      MOONCEN_API_PROFILE: public
      DB_HOST: /var/run/postgresql
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_SSLROOTCERT: ""
      DB_SSLCERT: ""
      DB_SSLKEY: ""
      API_HOST: 0.0.0.0
      API_PORT: "8001"
      API_RELOAD: "false"
    ports:
      - "127.0.0.1:${MOONCEN_API_BIND_PORT:-8001}:8001"
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health', timeout=5).read()"
      interval: 10s
      timeout: 6s
      retries: 12
      start_period: 10s
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/logs:size=64m,uid=10001,gid=10001,mode=0700
    pids_limit: 512
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 30s

  frontend:
    image: "${MOONCEN_FRONTEND_IMAGE:?Set the manifest-bound frontend image tag}"
    pull_policy: never
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${MOONCEN_FRONTEND_BIND_PORT:-5173}:8080"
    depends_on:
      api:
        condition: service_healthy
    volumes:
      - type: bind
        source: "${MOONCEN_RUNTIME_CONFIG_FILE:-/etc/mooncen/container-frontend-runtime-config.js}"
        target: /usr/share/nginx/html/runtime-config.js
        read_only: true
    networks:
      - app
    healthcheck:
      test:
        - CMD
        - wget
        - -q
        - -O
        - /dev/null
        - http://127.0.0.1:8080/_frontend_health
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    read_only: true
    tmpfs:
      - /tmp:size=32m,mode=1777
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 128
    mem_limit: 256m
    cpus: 1.0
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"
    stop_grace_period: 15s

  ai:
    <<: *api-runtime
    restart: unless-stopped
    env_file:
      - /etc/mooncen/container-ai.env
    environment:
      ENVIRONMENT: production
      DB_HOST: /var/run/postgresql
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_SSLROOTCERT: ""
      DB_SSLCERT: ""
      DB_SSLKEY: ""
      TZ: Asia/Seoul
    command:
      - /bin/sh
      - -ec
      - >-
        exec python -X utf8 run_ai_pipeline.py
        --batch-size "$${AI_BATCH_SIZE:-20}"
        --workers "$${AI_WORKERS:-2}"
        --delay "$${AI_DELAY:-0}"
        --poll-interval "$${AI_POLL_INTERVAL:-60}"
        --active-start "$${AI_ACTIVE_START:-22:00}"
        --active-end "$${AI_ACTIVE_END:-07:00}"
        $${AI_WEEKEND_24H:+--weekend-24h}
    tmpfs:
      - /tmp:size=64m,mode=1777
      - /app/logs:size=128m,uid=10001,gid=10001,mode=0700
    pids_limit: 256
    mem_limit: 2g
    cpus: 2.0
    stop_grace_period: 60s

networks:
  # The release controller supplies an exact allowlisted Compose project name.
  # Project-scoped networks let the alternate-port candidate run beside the
  # active stack without sharing application network state.
  app: {}
