worker_processes auto;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    log_format main '$remote_addr - $request_method $uri $status $body_bytes_sent '
                    '"$http_referer" "$http_user_agent"';
    access_log /dev/stdout main;

    sendfile on;
    keepalive_timeout 65;
    server_tokens off;
    client_max_body_size 10m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com https://nid.naver.com; script-src 'self' https://dapi.kakao.com https://t1.daumcdn.net https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://dapi.kakao.com https://t1.daumcdn.net https://www.googleapis.com https://oauth2.googleapis.com https://openapi.naver.com https://nid.naver.com; frame-src https://accounts.google.com https://*.google.com" always;

    client_body_temp_path /tmp/client_temp;
    proxy_temp_path /tmp/proxy_temp;
    fastcgi_temp_path /tmp/fastcgi_temp;
    uwsgi_temp_path /tmp/uwsgi_temp;
    scgi_temp_path /tmp/scgi_temp;

    gzip on;
    gzip_types application/javascript application/json application/xml image/svg+xml text/css text/plain;

    # Compose exposes this proxy only on loopback. Preserve an upstream HTTPS
    # marker when a trusted local TLS proxy is placed in front of it.
    map $http_x_forwarded_proto $mooncen_forwarded_proto {
        default $scheme;
        ~^(http|https)$ $http_x_forwarded_proto;
    }

    map $uri $mooncen_runtime_cache_control {
        default "";
        /runtime-config.js "no-store, no-cache, must-revalidate, max-age=0";
    }

    add_header Cache-Control $mooncen_runtime_cache_control always;

    resolver 127.0.0.11 valid=10s ipv6=off;

    upstream mooncen_api {
        zone mooncen_api 64k;
        server api:8001 resolve;
        keepalive 16;
    }

    server {
        listen 8080;
        server_name _;
        root /usr/share/nginx/html;
        index index.html;

        location = /_frontend_health {
            access_log off;
            try_files /index.html =503;
        }

        location = /runtime-config.js {
            access_log off;
            try_files $uri =404;
        }

        location = /health {
            proxy_pass http://mooncen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        }

        # The public web container must not become an alternate Ops origin.
        location = /api/ops {
            return 404;
        }

        location ^~ /api/ops/ {
            return 404;
        }

        location = /api/auth/ops {
            return 404;
        }

        location ^~ /api/auth/ops/ {
            return 404;
        }

        location /api/ {
            proxy_pass http://mooncen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        }

        # FastAPI owns these server-rendered SEO pages. Do not fall back to the SPA.
        location /course/ {
            proxy_pass http://mooncen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        }

        location /category/ {
            proxy_pass http://mooncen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        }

        location /branch/ {
            proxy_pass http://mooncen_api;
            proxy_set_header Host $host;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Host $host;
            proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        }

        location /assets/ {
            try_files $uri =404;
            expires 1h;
        }

        location = /index.html {
            try_files $uri =404;
            expires -1;
        }

        location = /sitemap.xml {
            try_files $uri =404;
            expires -1;
        }

        location = /robots.txt {
            try_files $uri =404;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
