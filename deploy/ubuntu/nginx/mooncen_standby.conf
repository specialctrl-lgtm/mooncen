log_format mooncen_standby_no_query '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent"';

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name _;
    access_log /var/log/nginx/mooncen_standby_access.log mooncen_standby_no_query;

    client_max_body_size 10m;

    location = /health {
        default_type application/json;
        return 503 '{"ok":false,"role":"standby","message":"MoonCen standby node is not serving application traffic"}';
    }

    location ~ ^/(api|courses|course|category|branch|branches|auth|users)/ {
        default_type application/json;
        return 503 '{"ok":false,"role":"standby","message":"MoonCen standby node. API traffic is disabled until failover."}';
    }

    location / {
        default_type text/html;
        return 200 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>MoonCen Standby</title><style>body{margin:0;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#f7faf9;color:#1f2933}.wrap{max-width:720px;margin:12vh auto;padding:32px;border:1px solid #d9e2ec;border-radius:12px;background:#fff;box-shadow:0 12px 32px rgba(31,41,51,.08)}h1{margin:0 0 12px;font-size:28px}.badge{display:inline-flex;margin-bottom:18px;padding:6px 10px;border-radius:999px;background:#fff7ed;color:#b45309;font-weight:800;font-size:13px}.muted{color:#52616b;line-height:1.65}code{background:#f1f5f9;padding:2px 5px;border-radius:5px}</style></head><body><main class="wrap"><div class="badge">STANDBY</div><h1>MoonCen n100 대기 서버</h1><p class="muted">이 서버는 현재 standby 상태이므로 프론트엔드와 API 트래픽을 처리하지 않습니다. 정상 서비스는 primary 서버에서 제공합니다.</p><p class="muted">장애 전환 전에는 n100의 DB를 승격하고 <code>mooncen-api</code>, <code>mooncen-frontend</code>, <code>cloudflared</code>를 시작해야 합니다.</p></main></body></html>';
    }
}
