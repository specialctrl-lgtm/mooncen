# Install as /etc/tmpfiles.d/mooncen-crawler-release-agent.conf after the
# dedicated worker/reporter groups exist, then run systemd-tmpfiles --create.
d /opt/mooncen-crawler 0750 root mooncen-crawler-worker -
d /opt/mooncen-crawler/releases 0750 root mooncen-crawler-worker -
d /opt/mooncen-crawler/.staging 0700 root root -
d /var/lib/mooncen-crawler-release-agent 0710 root mooncen-crawler-reporter -
d /var/lib/mooncen-crawler-release-agent/reports 2770 root mooncen-crawler-reporter -
