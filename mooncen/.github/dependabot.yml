version: 2
updates:
  - package-ecosystem: pip
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5

  - package-ecosystem: npm
    directory: /frontend2
    schedule:
      interval: weekly
    groups:
      frontend-runtime:
        dependency-type: production
      frontend-tooling:
        dependency-type: development

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: monthly

  - package-ecosystem: npm
    directory: /mooncen-app
    schedule:
      interval: weekly

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly

  - package-ecosystem: docker
    directory: /deploy/monitoring
    schedule:
      interval: weekly

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
