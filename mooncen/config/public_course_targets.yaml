# MoonCen public course crawler target registry.
# Scope: 사회복지관, 도서관, 문화센터, 시청/구청 통합예약, 평생학습/강좌신청.
# Status flow: candidate -> discovery -> ready -> implementing -> testing -> active -> paused/rejected.

version: 1
updated_at: "2026-05-24"

collection_policy:
  purpose: "지역 공공/복지/도서관/문화/평생학습 강좌 수집 대상 후보 관리"
  include:
    - "온라인에서 강좌 목록 또는 강좌 신청 목록을 공개하는 사이트"
    - "사회복지관, 종합사회복지관, 노인복지관, 장애인복지관 프로그램"
    - "공공도서관 문화강좌, 독서교실, 평생교육 프로그램"
    - "시청/구청/군청 통합예약의 교육/강좌/문화행사"
    - "평생학습관, 주민자치센터, 여성/가족/문화회관 강좌"
  exclude:
    - "로그인 후에만 목록이 보이는 개인 신청 내역"
    - "단순 공지 PDF만 있고 현재 강좌 목록 URL이 없는 페이지"
    - "수강권/바우처 안내만 있고 실제 강좌 목록이 없는 페이지"

required_fields:
  - provider
  - name
  - category
  - base_url
  - list_url
  - owner_type
  - status
  - priority
  - access

desired_course_fields:
  - title
  - provider_course_id
  - branch
  - category_raw
  - target
  - status
  - fee
  - period
  - schedule_raw
  - location
  - address
  - raw_url
  - description
  - instructor

source_categories:
  integrated_reservation:
    label: "통합예약"
    examples:
      - "시청/구청 통합예약"
      - "교육청 통합예약"
      - "시설관리공단 예약"
  lifelong_learning:
    label: "평생학습"
    examples:
      - "평생학습포털"
      - "평생학습관"
      - "주민자치센터 강좌"
  public_library:
    label: "도서관"
    examples:
      - "구립도서관 문화강좌"
      - "교육청 도서관 평생교육"
      - "독서교실/문화행사"
  welfare_center:
    label: "사회복지관"
    examples:
      - "종합사회복지관 프로그램"
      - "노인복지관 평생교육"
      - "장애인복지관 문화여가"
  public_culture_center:
    label: "공공 문화센터/문화회관"
    examples:
      - "여성문화회관"
      - "문화의집"
      - "생활문화센터"

discovery_queries:
  generic:
    - '"강좌신청" "통합예약" "교육/강좌"'
    - '"수강신청" "평생학습" "구청"'
    - '"문화강좌" "도서관" "신청"'
    - '"프로그램 신청" "사회복지관"'
    - '"주민자치센터" "수강신청"'
  site_scoped:
    - 'site:.go.kr "강좌신청" "통합예약"'
    - 'site:.go.kr "교육/강좌" "예약"'
    - 'site:.or.kr "사회복지관" "프로그램 신청"'
    - 'site:lib.*.kr "문화강좌" "수강신청"'
    - 'site:*.lib.go.kr "독서교실" "신청"'
    - 'site:*.edu "평생교육" "수강신청"'
  by_owner_type:
    city_hall:
      - '"시청" "통합예약" "강좌/교육"'
      - '"시청" "평생학습" "수강신청"'
    district_office:
      - '"구청" "통합예약" "강좌신청"'
      - '"구청" "주민자치센터" "수강신청"'
    library:
      - '"도서관" "문화강좌" "접수중"'
      - '"도서관" "수강신청" "강좌"'
    welfare:
      - '"종합사회복지관" "프로그램 신청"'
      - '"노인복지관" "평생교육" "수강신청"'
      - '"장애인복지관" "문화여가" "신청"'

