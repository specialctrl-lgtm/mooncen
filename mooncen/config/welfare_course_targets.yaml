implementation_groups:
- name: E-NCOM welfare course crawler
  priority: 1
  crawler_strategy:
  - 메인에서 수강신청 및 결제 메뉴 URL 확인
  - 목록이 로그인 없이 보이면 requests로 수집
  - 로그인 화면으로 막히면 목록 공개 여부만 상태 리포트
  - 동일 도메인 패턴으로 provider/branch/address 자동 등록
- name: Welfare board program crawler
  priority: 1
  target_providers:
  - BABSANG_WELFARE_PROGRAM
  - SAHASILVER_COURSE
  crawler_strategy:
  - 목록 페이지 pagination 수집
  - 상세 페이지에서 운영기간/접수기간/장소/인원/수강료 추출
  - 접수중/마감 상태 보정
- name: Municipal welfare/lifelong course crawler
  priority: 1
  target_providers:
  - YEONGTONG_WELFARE_ONLINE_COURSE
  - HAMYANG_WELFARE_OFFICIAL_COURSE
  - SEOSAN_WELFARE_TOTAL_RESERVATION
  - GWACHEON_WELFARE_LIFELONG_COURSE
  - HAMAN_WELFARE_LIFELONG_COURSE
  - HADONG_WELFARE_ACADEMY_COURSE
  - NONSAN_WELFARE_LIFELONG_COURSE
  - GWANGJIN_WELFARE_VENUE_COURSE
  crawler_strategy:
  - 지자체 통합예약/평생학습 목록에서 기관명 또는 장소명에 종합사회복지관이 포함된 강좌 필터링
  - 상세 페이지에서 접수기간, 교육기간, 요일/시간, 수강료, 정원, 신청현황 추출
  - 장소 기반 후보는 branch/venue를 분리 저장
  - 과거 강좌가 많은 포털은 최신 접수기간 기준으로 필터링
next_steps:
- E-NCOM 계열 3개 샘플로 목록 endpoint 확인
- 밥상공동체/사하사랑채는 HTML 목록 크롤러부터 구현
- candidate_notice/PDF 대상은 실제 신청 목록 URL 추가 발견 후 ready로 승격
- 사회복지관 검색 discovery tool을 만들어 새 후보를 YAML에 append
