version: 1
updated_at: '2026-05-24'
collection_policy:
  purpose: 사회복지관 계열 강좌/프로그램 신청 목록 수집 후보 관리
  include:
  - 수강신청, 강좌신청, 프로그램 신청 목록이 공개된 복지관
  - 노인복지관 평생교육/사회교육/취미여가 프로그램
  - 종합사회복지관 교육문화/지역주민 프로그램
  - 장애인복지관 문화여가/평생교육 프로그램
  - 노동자복지관 평생학습 프로그램
  exclude:
  - 봉사자 모집만 있는 페이지
  - 행사 공지 기사만 있고 실제 신청 목록 URL이 없는 페이지
  - 로그인 후 개인 신청내역만 볼 수 있는 페이지
  crawl_notes:
  - 복지관은 방문접수/전화접수도 많으므로 online_apply_available 필드를 둔다.
  - 회원가입 필요 여부와 목록 공개 여부를 분리한다.
  - PDF 모집 안내만 있는 경우 candidate_pdf_notice로 분리하고 정규 크롤러 대상에서는 낮은 우선순위로 둔다.
required_fields:
- provider
- name
- welfare_type
- region
- base_url
- list_url
- status
- priority
- access
desired_course_fields:
- title
- provider_course_id
- branch
- status
- fee
- target
- recruitment_period
- period
- schedule_raw
- capacity
- applied_count
- wait_count
- location
- raw_url
- description
- online_apply_available
