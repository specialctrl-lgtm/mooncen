# cloudflared reaches this origin through loopback. Trust its client-IP header
# only from loopback so direct clients cannot spoof the rate-limit identity.
set_real_ip_from 127.0.0.1;
set_real_ip_from ::1;
real_ip_header CF-Connecting-IP;
real_ip_recursive on;

map $http_cf_visitor $mooncen_forwarded_proto {
    default $scheme;
    ~*\"scheme\"\s*:\s*\"https\" https;
}

log_format mooncen_no_query '$remote_addr - $remote_user [$time_local] '
    '"$request_method $uri $server_protocol" $status $body_bytes_sent '
    '"-" "$http_user_agent"';

limit_req_zone $binary_remote_addr zone=mooncen_api:10m rate=15r/s;
limit_req_zone $binary_remote_addr zone=mooncen_auth:10m rate=5r/m;

server {
    listen 127.0.0.1:80;
    listen [::1]:80;
    server_name _;
    access_log /var/log/nginx/mooncen_access.log mooncen_no_query;

    client_max_body_size 10m;
    server_tokens off;
    limit_req_status 429;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types application/json application/javascript text/css text/plain text/xml image/svg+xml;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(self), payment=()" always;
    add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self' https://accounts.google.com https://nid.naver.com; script-src 'self' https://dapi.kakao.com https://t1.daumcdn.net https://accounts.google.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob: https:; connect-src 'self' https://dapi.kakao.com https://t1.daumcdn.net https://www.googleapis.com https://oauth2.googleapis.com https://openapi.naver.com https://nid.naver.com; frame-src https://accounts.google.com https://*.google.com; upgrade-insecure-requests" always;

    location ~ ^/api/auth/(login|signup|oauth/) {
        limit_req zone=mooncen_auth burst=5 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # The administrator API is published only by the standalone Ops origin.
    # Keep both the collection root and all descendants off mooncen.kr.
    location = /api/ops {
        return 404;
    }

    location ^~ /api/ops/ {
        return 404;
    }

    location ^~ /api/auth/ops/ {
        return 404;
    }

    location /api/ {
        limit_req zone=mooncen_api burst=30 nodelay;
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /courses/ {
        return 308 /api$request_uri;
    }

    location /course/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
    }

    location /category/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
    }

    location /branch/ {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
    }

    location = /branches/providers {
        return 308 /api$request_uri;
    }

    location = /branches/nearby {
        return 308 /api$request_uri;
    }

    location = /auth/signup { return 308 /api$request_uri; }
    location = /auth/login { return 308 /api$request_uri; }
    location = /auth/me { return 308 /api$request_uri; }
    location = /auth/oauth/config { return 308 /api$request_uri; }
    location = /auth/oauth/google { return 308 /api$request_uri; }
    location = /auth/oauth/naver { return 308 /api$request_uri; }

    location /users/ {
        return 308 /api$request_uri;
    }

    location /health {
        proxy_pass http://127.0.0.1:8001;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
    }

    location / {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $mooncen_forwarded_proto;
    }

    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|webp|avif|woff2?)$ {
        proxy_pass http://127.0.0.1:5173;
        proxy_set_header Host $host;
        expires 30d;
        access_log off;
    }
}
