<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="990" viewBox="0 0 1600 990">
  <defs>
    <style>
      .title{font:700 34px Arial,sans-serif;fill:#132238}.sub{font:400 17px Arial,sans-serif;fill:#56657a}
      .section{font:700 25px Arial,sans-serif;fill:#132238}.h{font:700 19px Arial,sans-serif;fill:#132238}.t{font:400 15px Arial,sans-serif;fill:#26364b}.small{font:400 13px Arial,sans-serif;fill:#56657a}
      .box{rx:15;ry:15;stroke-width:2}.arrow{stroke:#476782;stroke-width:3;fill:none;marker-end:url(#arrow)}
      .blocked{stroke:#bd4c43;stroke-width:3;stroke-dasharray:9 7;fill:none;marker-end:url(#redarrow)}
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#476782"/></marker>
    <marker id="redarrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto" markerUnits="strokeWidth"><path d="M0,0 L0,6 L9,3 z" fill="#bd4c43"/></marker>
  </defs>
  <rect width="1600" height="990" fill="#f6f8fb"/>
  <text x="65" y="58" class="title">Crawler Data Flow — Current and Target</text>
  <text x="65" y="88" class="sub">Promotion safeguards are implemented; distributed execution remains explicitly gated</text>

  <rect x="50" y="120" width="1500" height="345" rx="22" fill="#ffffff" stroke="#7aa285" stroke-width="3"/>
  <text x="80" y="163" class="section">A. Current declared mode: LEGACY</text>
  <rect x="85" y="220" width="230" height="135" class="box" fill="#ede9ff" stroke="#7868b4"/>
  <text x="200" y="257" text-anchor="middle" class="h">Provider Sources</text>
  <text x="200" y="288" text-anchor="middle" class="t">Public / partner websites</text>
  <text x="200" y="315" text-anchor="middle" class="t">42 logical provider groups</text>
  <text x="200" y="339" text-anchor="middle" class="small">Availability varies externally</text>
  <rect x="390" y="200" width="250" height="175" class="box" fill="#e8f1ff" stroke="#5f8ecb"/>
  <text x="515" y="238" text-anchor="middle" class="h">gen1crawler</text>
  <text x="515" y="270" text-anchor="middle" class="t">run_crawlers.py</text>
  <text x="515" y="297" text-anchor="middle" class="t">fixed-argv subprocesses</text>
  <text x="515" y="324" text-anchor="middle" class="t">lock · timeout · progress</text>
  <text x="515" y="350" text-anchor="middle" class="small">Single legacy orchestrator</text>
  <rect x="720" y="200" width="250" height="175" class="box" fill="#fff4df" stroke="#d29b3d"/>
  <text x="845" y="238" text-anchor="middle" class="h">Staging Batch</text>
  <text x="845" y="270" text-anchor="middle" class="t">branches · courses</text>
  <text x="845" y="297" text-anchor="middle" class="t">batch/provider ownership</text>
  <text x="845" y="324" text-anchor="middle" class="t">validation snapshots</text>
  <text x="845" y="350" text-anchor="middle" class="small">Dedicated staging/control DB</text>
  <rect x="1050" y="190" width="265" height="195" class="box" fill="#fdeeed" stroke="#c55f55"/>
  <text x="1182" y="228" text-anchor="middle" class="h">Promotion Controls</text>
  <text x="1182" y="260" text-anchor="middle" class="t">completeness + quality gates</text>
  <text x="1182" y="287" text-anchor="middle" class="t">reviewed dry-run fingerprint</text>
  <text x="1182" y="314" text-anchor="middle" class="t">pinned transactional apply</text>
  <text x="1182" y="341" text-anchor="middle" class="small">safe close-missing thresholds</text>
  <text x="1182" y="365" text-anchor="middle" class="small">fail closed on changed evidence</text>
  <rect x="1380" y="220" width="130" height="135" class="box" fill="#eaf7f2" stroke="#4f9b7a"/>
  <text x="1445" y="258" text-anchor="middle" class="h">Primary</text>
  <text x="1445" y="287" text-anchor="middle" class="t">Postgres</text>
  <text x="1445" y="315" text-anchor="middle" class="t">PostGIS</text>
  <text x="1445" y="340" text-anchor="middle" class="small">API reads</text>
  <path d="M315 287 H390" class="arrow"/><path d="M640 287 H720" class="arrow"/><path d="M970 287 H1050" class="arrow"/><path d="M1315 287 H1380" class="arrow"/>
  <text x="80" y="423" class="small">A batch is not production data until validation evidence and the reviewed fingerprint match at apply time.</text>

  <rect x="50" y="505" width="1500" height="415" rx="22" fill="#fffafa" stroke="#bd4c43" stroke-width="3"/>
  <text x="80" y="550" class="section">B. Target capability: DISTRIBUTED — NOT READY / ACTIVATION BLOCKED</text>
  <rect x="85" y="625" width="235" height="155" class="box" fill="#fff4df" stroke="#d29b3d"/>
  <text x="202" y="663" text-anchor="middle" class="h">Control Plane</text>
  <text x="202" y="694" text-anchor="middle" class="t">release artifact · desired state</text>
  <text x="202" y="721" text-anchor="middle" class="t">task / attempt / fenced lease</text>
  <text x="202" y="748" text-anchor="middle" class="small">Declared on gen1db</text>
  <rect x="405" y="590" width="270" height="225" class="box" fill="#ede9ff" stroke="#7868b4"/>
  <text x="540" y="627" text-anchor="middle" class="h">Canary-first Workers</text>
  <text x="540" y="659" text-anchor="middle" class="t">wtr-linux: canary, disabled</text>
  <text x="540" y="686" text-anchor="middle" class="t">gen1crawler: order 2, disabled</text>
  <text x="540" y="713" text-anchor="middle" class="t">434 concrete task expansion</text>
  <text x="540" y="741" text-anchor="middle" class="small">Resource limits + ownership leases</text>
  <rect x="760" y="600" width="250" height="205" class="box" fill="#e8f1ff" stroke="#5f8ecb"/>
  <text x="885" y="637" text-anchor="middle" class="h">Immutable Evidence</text>
  <text x="885" y="669" text-anchor="middle" class="t">attempt observations</text>
  <text x="885" y="696" text-anchor="middle" class="t">receipts · snapshots</text>
  <text x="885" y="723" text-anchor="middle" class="t">finalizer / publisher</text>
  <text x="885" y="751" text-anchor="middle" class="small">Fenced ownership validation</text>
  <rect x="1095" y="600" width="250" height="205" class="box" fill="#fdeeed" stroke="#c55f55"/>
  <text x="1220" y="637" text-anchor="middle" class="h">Same Promotion Gate</text>
  <text x="1220" y="669" text-anchor="middle" class="t">complete selected attempts</text>
  <text x="1220" y="696" text-anchor="middle" class="t">reviewed fingerprint</text>
  <text x="1220" y="723" text-anchor="middle" class="t">exact provider apply</text>
  <text x="1220" y="751" text-anchor="middle" class="small">No bypass to primary</text>
  <rect x="1400" y="625" width="105" height="155" class="box" fill="#eaf7f2" stroke="#4f9b7a"/>
  <text x="1452" y="664" text-anchor="middle" class="h">Primary</text>
  <text x="1452" y="695" text-anchor="middle" class="t">DB</text>
  <text x="1452" y="723" text-anchor="middle" class="small">after</text>
  <text x="1452" y="746" text-anchor="middle" class="small">approval</text>
  <path d="M320 702 H405" class="blocked"/><path d="M675 702 H760" class="blocked"/><path d="M1010 702 H1095" class="blocked"/><path d="M1345 702 H1400" class="blocked"/>
  <rect x="390" y="840" width="990" height="48" rx="12" fill="#bd4c43"/>
  <text x="885" y="871" text-anchor="middle" style="font:700 18px Arial,sans-serif;fill:white">GO requires verified backup/restore evidence, artifact + worker bootstrap, canary proof, monitoring, and atomic topology cutover</text>
  <text x="65" y="958" class="small">The target path is design and code capability, not evidence that distributed crawling is running in production.</text>
</svg>
