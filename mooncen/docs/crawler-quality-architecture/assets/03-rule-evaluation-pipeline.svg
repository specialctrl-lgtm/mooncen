<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="930" viewBox="0 0 1600 930" role="img" aria-labelledby="title desc">
  <title id="title">MoonCen deterministic rule evaluation pipeline</title>
  <desc id="desc">A stage-by-stage deterministic pipeline separating source adapter responsibilities from configurable rule stages and completeness gates.</desc>
  <defs><marker id="a" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#476782"/></marker><filter id="s"><feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#17324d" flood-opacity=".12"/></filter><style>.title{font:700 35px Arial,sans-serif;fill:#132238}.sub{font:17px Arial,sans-serif;fill:#5a687a}.h{font:700 19px Arial,sans-serif;fill:#17324d}.t{font:14px Arial,sans-serif;fill:#273444}.sm{font:13px Arial,sans-serif;fill:#5e6d7c}.lane{font:700 15px Arial,sans-serif;letter-spacing:1px;fill:#476782}.arr{stroke:#476782;stroke-width:4;fill:none;marker-end:url(#a)}</style></defs>
  <rect width="1600" height="930" fill="#f6f8fb"/><text x="65" y="62" class="title">Deterministic Rule Evaluation Pipeline</text><text x="65" y="102" class="sub">Every kept or dropped record carries stage, rule id, reason and source evidence</text>

  <rect x="48" y="140" width="1504" height="188" rx="22" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/><text x="75" y="176" class="lane">CODE-MANAGED ADAPTER BOUNDARY</text>
  <g filter="url(#s)"><rect x="88" y="210" width="300" height="88" rx="16" fill="#ede9ff" stroke="#7868b4" stroke-width="3"/><rect x="485" y="210" width="300" height="88" rx="16" fill="#ede9ff" stroke="#7868b4" stroke-width="3"/><rect x="882" y="210" width="300" height="88" rx="16" fill="#ede9ff" stroke="#7868b4" stroke-width="3"/><rect x="1279" y="210" width="235" height="88" rx="16" fill="#fff4df" stroke="#d29b3d" stroke-width="3"/></g>
  <text x="238" y="245" text-anchor="middle" class="h">Fetch / Authenticate</text><text x="238" y="272" text-anchor="middle" class="t">session, TLS, request budget</text>
  <text x="635" y="245" text-anchor="middle" class="h">Traverse / Paginate</text><text x="635" y="272" text-anchor="middle" class="t">cursor, JS/browser, detail fetch</text>
  <text x="1032" y="245" text-anchor="middle" class="h">Freeze Raw Evidence</text><text x="1032" y="272" text-anchor="middle" class="t">response + manifest + trace</text>
  <text x="1396" y="245" text-anchor="middle" class="h">Document Stream</text><text x="1396" y="272" text-anchor="middle" class="t">bounded input</text>
  <path d="M388 254 H485" class="arr"/><path d="M785 254 H882" class="arr"/><path d="M1182 254 H1279" class="arr"/>

  <rect x="48" y="365" width="1504" height="360" rx="22" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/><text x="75" y="401" class="lane">DATA-MANAGED RULE PACK · TYPED, VERSIONED, ALLOWLISTED</text>
  <g filter="url(#s)"><rect x="75" y="450" width="208" height="126" rx="16" fill="#e8f1ff" stroke="#5f8ecb" stroke-width="3"/><rect x="323" y="450" width="208" height="126" rx="16" fill="#edf7fb" stroke="#5791aa" stroke-width="3"/><rect x="571" y="450" width="208" height="126" rx="16" fill="#eaf7f2" stroke="#4f9b7a" stroke-width="3"/><rect x="819" y="450" width="208" height="126" rx="16" fill="#fff4df" stroke="#d29b3d" stroke-width="3"/><rect x="1067" y="450" width="208" height="126" rx="16" fill="#ede9ff" stroke="#7868b4" stroke-width="3"/><rect x="1315" y="450" width="208" height="126" rx="16" fill="#fdeeED" stroke="#c55f55" stroke-width="3"/></g>
  <text x="179" y="489" text-anchor="middle" class="h">1. Extract</text><text x="179" y="520" text-anchor="middle" class="t">CSS / JSON path</text><text x="179" y="545" text-anchor="middle" class="sm">field provenance</text>
  <text x="427" y="489" text-anchor="middle" class="h">2. Normalize</text><text x="427" y="520" text-anchor="middle" class="t">date / fee / text</text><text x="427" y="545" text-anchor="middle" class="sm">pure transforms</text>
  <text x="675" y="489" text-anchor="middle" class="h">3. Classify</text><text x="675" y="520" text-anchor="middle" class="t">include / exclude</text><text x="675" y="545" text-anchor="middle" class="sm">stable reason code</text>
  <text x="923" y="489" text-anchor="middle" class="h">4. Validate</text><text x="923" y="520" text-anchor="middle" class="t">semantic + fields</text><text x="923" y="545" text-anchor="middle" class="sm">fail closed</text>
  <text x="1171" y="489" text-anchor="middle" class="h">5. Identity</text><text x="1171" y="520" text-anchor="middle" class="t">dedupe / entity key</text><text x="1171" y="545" text-anchor="middle" class="sm">collision evidence</text>
  <text x="1419" y="489" text-anchor="middle" class="h">6. Coverage</text><text x="1419" y="520" text-anchor="middle" class="t">count / sentinel / detail</text><text x="1419" y="545" text-anchor="middle" class="sm">snapshot contract</text>
  <path d="M283 513 H323" class="arr"/><path d="M531 513 H571" class="arr"/><path d="M779 513 H819" class="arr"/><path d="M1027 513 H1067" class="arr"/><path d="M1275 513 H1315" class="arr"/>
  <rect x="150" y="622" width="1300" height="66" rx="15" fill="#17324d"/>
  <text x="800" y="651" text-anchor="middle" style="font:700 17px Arial,sans-serif;fill:#fff">Decision trace: snapshot SHA · adapter version · rule revision · stage · rule id · verdict · reason · evidence pointer</text><text x="800" y="676" text-anchor="middle" style="font:14px Arial,sans-serif;fill:#dbe7f3">Same inputs + same artifacts + same reference clock ⇒ byte-stable normalized output and diff</text>
  <path d="M1396 298 V385 H179 V450" class="arr"/>

  <rect x="48" y="760" width="1504" height="118" rx="22" fill="#ffffff" stroke="#d7e0e8" stroke-width="2"/>
  <g filter="url(#s)"><rect x="90" y="790" width="310" height="60" rx="14" fill="#eaf7f2" stroke="#4f9b7a" stroke-width="3"/><rect x="475" y="790" width="310" height="60" rx="14" fill="#fff4df" stroke="#d29b3d" stroke-width="3"/><rect x="860" y="790" width="310" height="60" rx="14" fill="#e8f1ff" stroke="#5f8ecb" stroke-width="3"/><rect x="1245" y="790" width="270" height="60" rx="14" fill="#fdeeED" stroke="#c55f55" stroke-width="3"/></g>
  <text x="245" y="827" text-anchor="middle" class="h">Kept Candidate Rows</text><text x="630" y="827" text-anchor="middle" class="h">Dropped + Quarantined</text><text x="1015" y="827" text-anchor="middle" class="h">Coverage Evidence</text><text x="1380" y="827" text-anchor="middle" class="h">Gate Result</text>
  <path d="M800 688 V745 H245 V790" class="arr"/><path d="M800 745 H630 V790" class="arr"/><path d="M800 745 H1015 V790" class="arr"/><path d="M800 745 H1380 V790" class="arr"/>
  <text x="65" y="908" class="sm">Precedence: global defaults → adapter family → provider → target → time-bounded emergency suppression. Conflicts fail compilation.</text>
</svg>
