[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [
    "_organized",
    "Crawler/generated_yaml",
    "android",
    "frontend",
    "frontend2",
    "mooncen-app",
    "venv",
]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    # High-signal security rules: dynamic execution, disabled TLS validation,
    # unsafe YAML, and shell command construction.
    "S102",
    "S307",
    "S314",
    "S501",
    "S506",
    "S602",
    "S604",
    "S605",
    "S609",
]

[tool.ruff.lint.per-file-ignores]
"Crawler/*.py" = ["E402"]
"DB/*.py" = ["E402"]
"tools/**/*.py" = ["E402"]
"utils/__init__.py" = ["E402"]
